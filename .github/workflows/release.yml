name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Require every signing secret (no unsigned releases)
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_CONNECT_KEY_P8 }}
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          for name in P12 P12_PASSWORD KEY_ID ISSUER_ID KEY_P8 TEAM; do
            [ -n "${!name}" ] || { echo "::error::Secret for $name is missing; refusing to publish an unsigned build."; exit 1; }
          done

      - name: Import Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - run: brew install xcodegen
      - run: Scripts/bootstrap.sh

      - name: Build, sign and package
        env:
          TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
        run: |
          identity=$(security find-identity -v -p codesigning | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$identity" ] || { echo "::error::No Developer ID Application identity in the keychain"; exit 1; }
          echo "DMG=$(Scripts/release/build-dmg.sh --sign "$identity" | tail -1)" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          APPSTORE_CONNECT_KEY_ID: ${{ secrets.APPSTORE_CONNECT_KEY_ID }}
          APPSTORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_CONNECT_KEY_P8 }}
        run: |
          export APPSTORE_CONNECT_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$KEY_P8" > "$APPSTORE_CONNECT_KEY_PATH"
          Scripts/release/notarize.sh "$DMG"
          rm "$APPSTORE_CONNECT_KEY_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$DMG" --title "Lunula $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
